// Top-level build file for ReflectMaster 2.0
//
// Toolchain: Gradle 8.9 / AGP 8.7.3 / Kotlin 2.0.21 / JDK 17
// The old project used AGP 3.1.3 + Gradle 4.4 + jcenter(), none of which can
// run on a modern JDK, and jcenter() has been shut down since 2021.

buildscript {
    ext {
        agpVersion = '8.7.3'
        kotlinVersion = '2.0.21'
    }

    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    }

    dependencies {
        classpath "com.android.tools.build:gradle:${agpVersion}"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
