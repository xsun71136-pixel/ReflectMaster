plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ---------------------------------------------------------------------------
// Optional release signing.
// CI (or a local developer) drops a `keystore.properties` at the project root:
//   storeFile=/abs/path/rm.keystore
//   storePassword=...
//   keyAlias=...
//   keyPassword=...
// When the file is absent the release variant is simply left unsigned and the
// debug variant (always debug-signed) is what gets installed.
// ---------------------------------------------------------------------------
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
def hasReleaseSigning = false
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
    hasReleaseSigning = keystoreProps.getProperty('storeFile') != null &&
            new File(keystoreProps.getProperty('storeFile')).exists()
}

android {
    namespace 'formatfa.reflectmaster'
    compileSdk 35

    defaultConfig {
        applicationId 'formatfa.reflectmaster'
        // Xposed/LSPosed modules do not need to support ancient devices, and
        // minSdk 24 lets us use java.time-free but modern APIs (notification
        // channels, adaptive icons, Settings.canDrawOverlays, ...).
        minSdk 24
        // targetSdk 34: the previous value (22) made the APK *uninstallable* on
        // Android 11+ (INSTALL_FAILED_DEPRECATED_SDK_VERSION requires >= 23).
        targetSdk 34
        versionCode 20
        versionName '2.0.0'
        vectorDrawables.useSupportLibrary = false
    }

    buildFeatures {
        viewBinding false
        buildConfig true
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            minifyEnabled false
        }
        release {
            // Reflection is the whole point of this app: R8/ProGuard would
            // rename the classes that FakeScript binds via getMethods() and
            // break every inspector screen. Obfuscation stays off on purpose.
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Sources contain Chinese literals and a few box-drawing glyphs.
        encoding = 'UTF-8'
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        warningsAsErrors false
    }
}

dependencies {
    // Xposed/LSPosed bridge API. compileOnly: the framework supplies the real
    // implementation at runtime inside the hooked process.
    compileOnly files('libs/api-82.jar')

    implementation project(':fake-script')

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
