name: Build APK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ]; then
            yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          fi

      # Release signing is optional. When the four RM_* secrets exist the release
      # APK is signed with a stable key (so upgrades do not need an uninstall);
      # otherwise the release stays unsigned and the debug APK - which Gradle
      # always signs with the runner's debug key - is the installable artefact.
      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RM_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RM_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RM_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rm.keystore"
            {
              echo "storeFile=$RUNNER_TEMP/rm.keystore"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "SIGNING=signed" >> "$GITHUB_ENV"
            echo "::notice::release 构建将使用固定签名"
          else
            echo "SIGNING=unsigned" >> "$GITHUB_ENV"
            echo "::notice::没有配置 RM_KEYSTORE_BASE64，release 为未签名构建"
          fi

      - name: Static gate
        run: |
          python3 tools/static_gate.py
          python3 tools/symbol_gate.py

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Collect artefacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk out/ 2>/dev/null || true
          ls -l out
          for f in out/*.apk; do
            echo "$(sha256sum "$f")"
          done > out/SHA256SUMS.txt
          cat out/SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ReflectMaster-2.0.0-apks
          path: out/
          if-no-files-found: error
          retention-days: 30
